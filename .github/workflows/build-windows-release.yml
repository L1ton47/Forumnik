name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub Release tag to attach Forumnik.exe to'
        required: true
        default: 'v1.3'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Forumnik.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Forumnik --add-data "ui;ui" --collect-all webview main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Forumnik.exe')) {
            throw 'Build failed: dist/Forumnik.exe was not created.'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forumnik-Windows-x64
          path: dist/Forumnik.exe
          if-no-files-found: error

      - name: Attach executable to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$env:RELEASE_TAG" "dist/Forumnik.exe" --clobber
