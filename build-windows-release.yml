name: .github/workflows/build-windows-release.yml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
            - name: Get source code
        uses: actions/checkout@v4
        with:
          ref: main
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

                  - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller

      - name: Build Forumnik.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Forumnik --add-data "ui;ui" --collect-all webview main.py

      - name: Verify executable exists
        run: |
          if (!(Test-Path "dist/Forumnik.exe")) {
            throw "Build failed: dist/Forumnik.exe was not created."
          }

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Forumnik-Windows-x64
          path: dist/Forumnik.exe
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "dist/Forumnik.exe" --clobber
        
